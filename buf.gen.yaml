version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: java_package_prefix
      value: fr.fbernard.grpc
    - file_option: go_package_prefix
      value: github.com/fb64/grpc-fullstack-demo/newscli/gen
plugins:
  # Kotlin server (backends/kotlin-graal)
  - remote: buf.build/protocolbuffers/java:v36.2
    out: backends/kotlin-graal/src/generated/java
  - remote: buf.build/protocolbuffers/kotlin:v36.2
    out: backends/kotlin-graal/src/generated/kotlin
  - remote: buf.build/grpc/java:v1.85.1
    out: backends/kotlin-graal/src/generated/java
  - remote: buf.build/grpc/kotlin:v1.5.0
    out: backends/kotlin-graal/src/generated/kotlin

  # Go command line client (newscli)
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: newscli/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: newscli/gen
    opt: paths=source_relative

  # Web application (web)
  - remote: buf.build/bufbuild/es:v2.17.0
    out: web/src/gen
    opt: target=ts

  # Android application (android), protobuf lite runtime
  - remote: buf.build/protocolbuffers/java:v36.2
    out: android/app/src/generated/java
    opt: lite
  - remote: buf.build/protocolbuffers/kotlin:v36.2
    out: android/app/src/generated/kotlin
    opt: lite
  - remote: buf.build/grpc/java:v1.85.1
    out: android/app/src/generated/java
    opt: lite
  - remote: buf.build/grpc/kotlin:v1.5.0
    out: android/app/src/generated/kotlin

  # iOS application (ios/NewsKit), grpc-swift 2
  - remote: buf.build/apple/swift:v1.39.0
    out: ios/NewsKit/Sources/NewsKit/Generated
    opt: Visibility=Public
  - remote: buf.build/grpc/swift-protobuf:v2.5.0
    out: ios/NewsKit/Sources/NewsKit/Generated
    opt: Visibility=Public
