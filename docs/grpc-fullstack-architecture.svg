<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">gRPC full stack architecture</title>
  <desc id="desc">One proto file generates code for the Kotlin server, the Go CLI, the web app, Android and iOS. At run time the CLI and mobile apps call the server with gRPC, and the browser goes through a Hono server with grpc-web-middleware.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <style>
      .panel { fill: #ffffff; stroke: #d9dee5; }
      .box { fill: #f4f6f9; stroke: #b8c2cc; }
      .accent { fill: #e6f4f1; stroke: #0f766e; }
      .proxy { fill: #fff6e5; stroke: #d08a1c; }
      .heading { font-size: 15px; font-weight: 700; fill: #1f2933; }
      .name { font-size: 14px; font-weight: 600; fill: #1f2933; }
      .detail { font-size: 12px; fill: #52606d; }
      .label { font-size: 12px; font-weight: 600; fill: #0f766e; }
      .line { stroke: #0f766e; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="899" height="549" rx="14"/>

  <!-- Build time -->
  <text class="heading" x="24" y="32">Build time: one proto file, code generated for every language</text>
  <rect class="accent" x="330" y="48" width="240" height="46" rx="8"/>
  <text class="name" x="450" y="68" text-anchor="middle">news_service.proto</text>
  <text class="detail" x="450" y="85" text-anchor="middle">package demo.news.v1</text>

  <path class="line" d="M450 94 V112"/>
  <text class="label" x="460" y="108">buf generate</text>
  <path class="line" d="M106 118 H794"/>
  <path class="line" d="M450 112 V118"/>
  <path class="line" marker-end="url(#arrow)" d="M106 118 V134"/>
  <path class="line" marker-end="url(#arrow)" d="M278 118 V134"/>
  <path class="line" marker-end="url(#arrow)" d="M450 118 V134"/>
  <path class="line" marker-end="url(#arrow)" d="M622 118 V134"/>
  <path class="line" marker-end="url(#arrow)" d="M794 118 V134"/>

  <rect class="box" x="26" y="136" width="160" height="50" rx="8"/>
  <text class="name" x="106" y="157" text-anchor="middle">Java + Kotlin</text>
  <text class="detail" x="106" y="174" text-anchor="middle">server</text>
  <rect class="box" x="198" y="136" width="160" height="50" rx="8"/>
  <text class="name" x="278" y="157" text-anchor="middle">Go</text>
  <text class="detail" x="278" y="174" text-anchor="middle">newscli</text>
  <rect class="box" x="370" y="136" width="160" height="50" rx="8"/>
  <text class="name" x="450" y="157" text-anchor="middle">TypeScript</text>
  <text class="detail" x="450" y="174" text-anchor="middle">web (Connect-ES)</text>
  <rect class="box" x="542" y="136" width="160" height="50" rx="8"/>
  <text class="name" x="622" y="157" text-anchor="middle">Java lite + Kotlin</text>
  <text class="detail" x="622" y="174" text-anchor="middle">android</text>
  <rect class="box" x="714" y="136" width="160" height="50" rx="8"/>
  <text class="name" x="794" y="157" text-anchor="middle">Swift</text>
  <text class="detail" x="794" y="174" text-anchor="middle">ios (grpc-swift 2)</text>

  <path d="M24 210 H876" stroke="#d9dee5"/>

  <!-- Run time -->
  <text class="heading" x="24" y="242">Run time</text>

  <rect class="box" x="40" y="262" width="200" height="50" rx="8"/>
  <text class="name" x="140" y="283" text-anchor="middle">Go CLI</text>
  <text class="detail" x="140" y="300" text-anchor="middle">urfave/cli</text>
  <rect class="box" x="40" y="328" width="200" height="50" rx="8"/>
  <text class="name" x="140" y="349" text-anchor="middle">Android app</text>
  <text class="detail" x="140" y="366" text-anchor="middle">Compose · grpc-kotlin</text>
  <rect class="box" x="40" y="394" width="200" height="50" rx="8"/>
  <text class="name" x="140" y="415" text-anchor="middle">iOS app</text>
  <text class="detail" x="140" y="432" text-anchor="middle">SwiftUI · grpc-swift 2</text>
  <rect class="box" x="40" y="474" width="200" height="50" rx="8"/>
  <text class="name" x="140" y="495" text-anchor="middle">Browser</text>
  <text class="detail" x="140" y="512" text-anchor="middle">Svelte · Connect-ES</text>

  <rect class="proxy" x="330" y="474" width="230" height="50" rx="8"/>
  <text class="name" x="445" y="495" text-anchor="middle">Hono web server :3000</text>
  <text class="detail" x="445" y="512" text-anchor="middle">grpc-web-middleware</text>

  <rect class="accent" x="640" y="290" width="230" height="150" rx="10"/>
  <text class="name" x="755" y="322" text-anchor="middle">Kotlin gRPC server :6565</text>
  <text class="detail" x="755" y="342" text-anchor="middle">grpc-kotlin · GraalVM native</text>
  <text class="detail" x="755" y="372" text-anchor="middle">NewsService</text>
  <text class="detail" x="755" y="390" text-anchor="middle">GetNews · Subscribe · PostNews</text>
  <text class="detail" x="755" y="418" text-anchor="middle">+ health, reflection</text>

  <path class="line" marker-end="url(#arrow)" d="M240 287 C 440 287, 460 325, 638 325"/>
  <path class="line" marker-end="url(#arrow)" d="M240 353 C 440 353, 460 365, 638 365"/>
  <path class="line" marker-end="url(#arrow)" d="M240 419 C 440 419, 460 405, 638 405"/>
  <text class="label" x="400" y="292">gRPC (HTTP/2)</text>

  <path class="line" marker-end="url(#arrow)" d="M240 499 H328"/>
  <text class="label" x="284" y="490" text-anchor="middle">grpc-web</text>
  <path class="line" marker-end="url(#arrow)" d="M560 499 C 680 499, 755 499, 755 442"/>
  <text class="label" x="610" y="490">gRPC</text>
</svg>
