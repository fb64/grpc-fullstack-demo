[tools]
java = "graalvm-community-25.0.2"
go = "1.27.4"
node = "26.13.1"
buf = "1.75.0"
# iOS: Xcode provides Swift on macOS; on Linux, mise provides it to build and test NewsKit.
swift = { version = "6.4.2", os = ["linux"] }
"aqua:yonaskolb/XcodeGen" = { version = "2.46.0", os = ["macos"] }

[tasks."proto:lint"]
description = "Lint and check formatting of the proto files"
run = ["buf lint", "buf format --diff --exit-code"]

[tasks."proto:format"]
description = "Format the proto files in place"
run = "buf format --write"

[tasks."proto:breaking"]
description = "Check the proto files for breaking changes against master (or $BUF_BREAKING_AGAINST)"
run = "buf breaking --against \"${BUF_BREAKING_AGAINST:-.git#branch=master,subdir=proto}\""

[tasks.lint]
description = "Run every linter"
depends = ["proto:lint", "cli:lint", "web:check"]

[tasks.generate]
description = "Generate the code of every part from the proto files"
run = "buf generate"

[tasks."generate:check"]
description = "Fail if the committed generated code is out of date"
depends = ["generate"]
run = [
  "git diff --exit-code",
  "test -z \"$(git ls-files --others --exclude-standard)\" || (git ls-files --others --exclude-standard; exit 1)",
]

[tasks.server]
description = "Run the Kotlin gRPC server on the JVM (port 6565)"
dir = "backends/kotlin-graal"
run = "./gradlew run"

[tasks."server:native"]
description = "Build the Kotlin gRPC server as a GraalVM native binary and run it"
dir = "backends/kotlin-graal"
run = ["./gradlew nativeCompile", "build/native/nativeCompile/news-server"]

[tasks."server:test"]
description = "Run the Kotlin gRPC server tests"
dir = "backends/kotlin-graal"
run = "./gradlew test"

[tasks."server:image"]
description = "Build the server container image with podman (or docker if podman is missing)"
dir = "backends/kotlin-graal"
run = "$(command -v podman || command -v docker) build -t news-server -f Containerfile ."

[tasks.cli]
description = "Run the Go command line client, e.g. `mise run cli -- list -t tech`"
dir = "newscli"
run = "go run ."

[tasks."cli:test"]
description = "Run the Go command line client tests"
dir = "newscli"
run = "go test ./..."

[tasks."cli:lint"]
description = "Check formatting and vet the Go command line client"
dir = "newscli"
run = ["test -z \"$(gofmt -l .)\" || (gofmt -l .; exit 1)", "go vet ./..."]

[tasks."web:install"]
description = "Install the web application dependencies"
dir = "web"
run = "npm ci"

[tasks.web]
description = "Run the web application with hot reload on http://localhost:5173 (needs the server)"
dir = "web"
run = ["test -d node_modules || npm ci", "npm run dev"]

[tasks."web:start"]
description = "Build the web application and serve it with the Hono server on http://localhost:3000"
dir = "web"
run = ["test -d node_modules || npm ci", "npm run build", "npm start"]

[tasks."web:check"]
description = "Type-check the web application (svelte-check)"
dir = "web"
run = ["test -d node_modules || npm ci", "npm run check"]

[tasks."web:image"]
description = "Build the web container image with podman (or docker if podman is missing)"
dir = "web"
run = "$(command -v podman || command -v docker) build -t news-web -f Containerfile ."

[tasks."android:build"]
description = "Build the Android debug APK (needs the Android SDK, see android/README.md)"
dir = "android"
tools = { java = "temurin-21.0.13+9.0.LTS" }
run = "./gradlew assembleDebug"

[tasks."android:test"]
description = "Run the Android unit tests (needs the Android SDK)"
dir = "android"
tools = { java = "temurin-21.0.13+9.0.LTS" }
run = "./gradlew testDebugUnitTest"

[tasks."android:install"]
description = "Install the Android app on the running emulator or connected device"
dir = "android"
tools = { java = "temurin-21.0.13+9.0.LTS" }
run = "./gradlew installDebug"

[tasks."ios:project"]
description = "Generate ios/GrpcNews.xcodeproj with XcodeGen (macOS)"
dir = "ios"
run = "xcodegen generate"

[tasks."ios:build"]
description = "Build the iOS app for the simulator (macOS, Xcode)"
dir = "ios"
depends = ["ios:project"]
run = "xcodebuild -project GrpcNews.xcodeproj -scheme GrpcNews -destination 'generic/platform=iOS Simulator' -quiet build"

[tasks."ios:test"]
description = "Run the NewsKit tests (macOS or Linux); set NEWS_SERVER_PORT to also test against a running server"
dir = "ios/NewsKit"
run = "swift test"

[tasks.test]
description = "Run every test suite"
depends = ["server:test", "cli:test"]
